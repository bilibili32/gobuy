<!doctype html>

<head data-page-node-id="eHwkjH0AyL7KGOTaDtbhjv">
  <meta charset="utf-8" data-page-node-id="hO7CGWtySQIP4n5a1Bk28o">
  <meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="Nia8FLUrtcniaI4F2gaKuE">
  <title>登录 · 采购系统</title>
  <style>
    .text-link { border:0; padding:0; background:none; color:var(--green); font:inherit; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
    .text-link:hover { color:var(--green-dark); }
    :root { --bg:#f6f2e9; --surface:#fffdfa; --ink:#25312d; --muted:#7b847f; --line:#e6dfd3; --green:#28725a; --green-dark:#1e5e49; --red:#a3463f; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .card { width:min(400px,calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:34px 32px 30px; box-shadow:0 12px 34px rgba(37,49,45,.06); }
    .brand { font-size:19px; font-weight:800; letter-spacing:.02em; text-align:center; } .brand span { color:var(--green); }
    .login-title { margin:18px 0 0; text-align:center; font-size:18px; line-height:1.3; }
    .sub { margin:6px 0 26px; text-align:center; color:var(--muted); font-size:13px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; margin-bottom:22px; border-bottom:1px solid var(--line); }
    .tab { border:0; background:none; padding:10px 0; font:inherit; font-weight:700; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; transition:color .15s ease, background-color .15s ease; }
    .tab.active { color:var(--green); border-bottom-color:var(--green); }
    label { display:block; margin:13px 0 6px; font-size:12px; color:var(--muted); font-weight:700; }
    input { width:100%; height:40px; padding:0 12px; border:1px solid var(--line); border-radius:5px; outline:none; background:#fff; font:inherit; }
    input:focus { border-color:var(--green); }
    input:focus-visible { box-shadow:0 0 0 3px rgba(40,114,90,.12); }
    .submit { width:100%; min-height:42px; margin-top:22px; border:0; border-radius:5px; background:var(--green); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
    .submit:hover { background:var(--green-dark); } .submit:disabled { opacity:.6; cursor:not-allowed; }
    .error { display:none; margin-top:14px; padding:9px 12px; border-radius:5px; background:#f8e7e4; color:var(--red); font-size:12.5px; }
    .error.show { display:block; }
    .hint { margin-top:16px; text-align:center; color:var(--muted); font-size:11.5px; }
    .hint b { color:var(--ink); }
  </style>
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="pg-login" data-page-node-id="Cl7mamiCBYNZZqSH9K6rBb">
  <div class="card" data-page-node-id="n38SeQvi5zs7x8DpbX0Yh8">
    <div class="brand" data-page-node-id="P8YT4AyvJnaCHU3RgkmfAV">
      <svg class="brand-ico" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="bgrad" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#33a97c"/><stop offset="1" stop-color="#185f49"/>
          </linearGradient>
        </defs>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="26s" repeatCount="indefinite"/>
          <circle cx="20" cy="20" r="16" stroke="url(#bgrad)" stroke-width="2.4" stroke-dasharray="13 6 5 6" stroke-linecap="round"/>
        </g>
        <circle cx="20" cy="20" r="16" stroke="#2fa377" stroke-opacity=".25" stroke-width="1.3"/>
        <path d="M20 26.2 V16.4" stroke="url(#bgrad)" stroke-width="3" stroke-linecap="round"/>
        <path d="M14.6 19.7 L20 13.6 L25.4 19.7 L20 16.8 Z" fill="url(#bgrad)"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="3.2s" repeatCount="indefinite"/>
          <circle cx="36" cy="20" r="2.2" fill="#f0b429"/>
        </g>
      </svg>
      <span class="brand-txt">买办</span>
    </div>
    <h1 class="login-title" id="login-title">登录买办</h1>
    <div class="sub" data-page-node-id="2JEMVjVfpzNaxKggtUfRKo">顺手的事</div>
    <div class="tabs" role="tablist" data-page-node-id="6XsDFA2ksDEhBV5gLzQKm2">
      <button class="tab active" id="tab-login" role="tab" aria-selected="true" onclick="switchTab('login')" data-page-node-id="eF3eWQxQMbdJqI5JXBJEO3">登录</button>
      <button class="tab" id="tab-register" role="tab" aria-selected="false" onclick="switchTab('register')" data-page-node-id="CUFSAHeQWg4XcZyTKtfer0">注册</button>
    </div>
    <form id="form" onsubmit="handleSubmit(event)" data-page-node-id="pqZbZ70GoyTFQZKqpzoQFh">
      <div id="name-field" style="display:none" data-page-node-id="DLc04qRfBcKHzbaHUp4MQt">
        <label for="full_name" data-page-node-id="zI0LmWdKEN0BFvrX5e3joF">姓名</label>
        <input id="full_name" name="full_name" autocomplete="name" placeholder="你的真实姓名" data-page-node-id="xqFSRqfRYp8sQys2OeMu9y">
      </div>
      <label for="email" data-page-node-id="Q5hJ3nPtda2PvAAXESHM6x">邮箱</label>
      <input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required data-page-node-id="PNweDdnzOv6CaNXFOVNGpm">
      <label for="password" data-page-node-id="daOPCGRgBE52ETvtyGxeYk">密码</label>
      <input id="password" type="password" name="password" autocomplete="current-password" placeholder="至少 10 位" required data-page-node-id="KOMLGoxs80jUnAJ0QBjz2H">
      <button class="submit" id="submit-btn" type="submit" data-page-node-id="sDt0eLRMRjerqxZFx7F6ca">登 录</button>
      <div class="error" id="error" role="alert" aria-live="assertive" aria-atomic="true" data-page-node-id="Jh1O7b8srjA2Xi2AlzfQCp"></div>
    </form>
    <div class="hint" id="hint" aria-live="polite" data-page-node-id="p7ywd7Ps7IqMav6J8b1mxU">还没有账号？<button type="button" class="text-link" onclick="switchTab('register')" data-page-node-id="ZJmaD8pkcA78VBVGeu8xaj">立即注册</button></div>
  </div>
  <script src="auth.js"></script>
  <script>
    let mode = "login";
    let regOpen = true;
    // 来自邀请链接的入组邀请码（login.html?invite=XXXX）
    const INVITE = new URLSearchParams(location.search).get("invite");

    function applyRegClosed() {
      regOpen = false;
      document.getElementById("tab-register").style.display = "none";
      document.getElementById("hint").innerHTML = "账号由管理员统一创建，如有需要请联系管理员";
    }

    function switchTab(next) {
      if (next === "register" && !regOpen) return;
      mode = next;
      const isLogin = next === "login";
      document.getElementById("tab-login").classList.toggle("active", isLogin);
      document.getElementById("tab-register").classList.toggle("active", !isLogin);
      document.getElementById("name-field").style.display = isLogin ? "none" : "block";
      document.getElementById("submit-btn").textContent = isLogin ? "登 录" : "注 册";
      document.getElementById("login-title").textContent = isLogin ? "登录买办" : "创建买办账号";
      document.getElementById("tab-login").setAttribute("aria-selected", String(isLogin));
      document.getElementById("tab-register").setAttribute("aria-selected", String(!isLogin));
      document.getElementById("hint").innerHTML = isLogin
        ? '还没有账号？<button type="button" class="text-link" onclick="switchTab(\'register\')">立即注册</button>'
        : '已有账号？<button type="button" class="text-link" onclick="switchTab(\'login\')">返回登录</button>';
      hideError();
    }

    function showError(msg) { const e = document.getElementById("error"); e.textContent = msg; e.classList.add("show"); }
    function hideError() { document.getElementById("error").classList.remove("show"); }

    // 受邀请时提示：你受邀加入一个出游采购组，登录/注册成功后会自动加入。
    function showInviteTip() {
      if (!INVITE) return;
      const hint = document.getElementById("hint");
      if (hint) {
        hint.innerHTML = "你受邀加入一个出游采购组，<b>登录/注册成功后自动入组</b>。已有账号点击 <button type=\"button\" class=\"text-link\" onclick=\"switchTab('login')\">登录</button>";
      }
    }

    (async function checkRegistration() {
      try {
        const r = await fetch((window.API_BASE || "") + "/api/settings/registration");
        if (r.ok) { const j = await r.json(); if (!j.allow_registration) applyRegClosed(); }
      } catch (err) { /* 后端不可达时保留注册入口 */ }
    })();

    showInviteTip();
    async function handleSubmit(ev) {
      ev.preventDefault();
      hideError();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      try {
        if (mode === "register") {
          const full_name = document.getElementById("full_name").value.trim();
          if (!full_name) { showError("请填写姓名"); return; }
          await api("/api/auth/register", { method: "POST", auth: false, body: { email, full_name, password } });
        }
        const data = await api("/api/auth/login", { method: "POST", auth: false, body: { email, password } });
        setSession(data.access_token, data.role);
        // 若带邀请码，登录成功后自动加入对应出游组（需求人视角；采购员/管理员点链接同样生效，但账号类型不合会被后端拒绝，仍正常跳转）。
        if (INVITE) {
          try { await api("/api/groups/join", { method: "POST", body: { invite_code: INVITE } }); }
          catch (peer) { /* 已入组/邀请码无效等，不阻断登录跳转 */ }
        }
        location.href = data.role === "admin" ? "admin.html" : (data.role === "purchaser" ? "purchaser.html" : "index.html");
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>

          <label data-page-node-id="mz5ywRV7aI7EPaCx3tjL3F">组名<input id="pgn-name" placeholder="如：海外直采组" data-page-node-id="ymKw1vdpNK56Bv93oUU5xr"></label>
          <label data-page-node-id="Qc4tWm3T2kA0dP7rN8jL5v">国家<select id="pgn-country" onchange="onPgCountry()"><option value="">选择国家</option></select></label>
          <label data-page-node-id="hgRX2emGlsMpUs7BGyDg3D">税率（%）<input id="pgn-tax" type="number" step="0.1" min="0" max="100" value="10" data-page-node-id="lJzJuPrtBawgTeTmcec1G7"></label>
          <label data-page-node-id="3obZinYBHxuiBq0TWIm7eu">汇率（1 <span id="pgn-cur">本币</span> = 元）<input id="pgn-rate" type="number" step="0.0001" min="0.0001" value="0.048" inputmode="decimal" data-page-node-id="D9AfoDv2M6DMPq496veod6"></label>
          <button class="parse-btn" onclick="addPriceGroup()" data-page-node-id="Brtd4hhK3wyMtrBkAMSSJK">添加分组</button>
        </div>
      </section>

      <section class="create-card" id="create-card" data-page-node-id="AnjjkC8eeYkP4Zo0brljUN">
        <div class="cc-head" data-page-node-id="qnIqImO2011I9nMClIBUJw">新建出游采购组</div>
        <p class="cc-tip" data-page-node-id="OzHwENOmjDfzCMzKnpjFyt">标题 + 出游日期区间（开始日期 ~ 结束日期）；创建后自动生成 4 位邀请码，可把需求人批量拉入，或把邀请码发给同事自助加入。</p>
        <div class="cc-row" data-page-node-id="52bUooXV8NZrrM7hkBAgxe">
          <label data-page-node-id="mqk5zSHmRMF760ZKev0Jbb">组标题<input id="g-title" autocomplete="off" placeholder="例如：9月东京代购" data-page-node-id="rCSNHGVRA4HITU4jP5F4FS"></label>
          <label data-page-node-id="rCSNHGVRA4HITU4jP5F4FS">国家<select id="g-country" autocomplete="off" data-page-node-id="5FwTlV6XwFfp2IRZZVQ9zY"></select></label>
          <label data-page-node-id="5FwTlV6XwFfp2IRZZVQ9zY">开始日期<input id="g-start" type="date" data-page-node-id="ZFp7o3GjWUrsKIDdMabuKW"></label>
          <label data-page-node-id="dnynAE7mmN8sZj87n7U1lC">结束日期<input id="g-end" type="date" autocomplete="off" data-page-node-id="vvdUxQkZg7WW7Ek5qU3njd"></label>
          <button class="g-btn primary" onclick="createGroup()" data-page-node-id="RqU6FUktip5AQU9l39vD69">创建出游组</button>
        </div>
        <div class="quota" id="quota-tip" data-page-node-id="xSZfCbNcQKM7LSsWD0kM9V"></div>
      </section>

      <section class="groups" id="groups" data-page-node-id="kS9ZeAyiTeVU128pNQ92w3"><div class="loading" data-page-node-id="d0Phk1DBhk2n85yRoynxVx">加载中…</div></section>
    </main>
  </div>
  <div class="page-credit"><span class="credit-line"></span><span class="credit-txt"><span class="credit-mark">🕊️</span><b>世界编织者 · 蓝鸠屿 Sarsing</b></span></div>
  <div class="notice" id="notice" role="status" aria-live="polite" aria-atomic="true" data-page-node-id="RXleRNF1PeCmJR0d3rx5Yt">已更新</div>
  <script src="auth.js"></script>
  <script src="export.js"></script>
  <script>
    let groups = [];
    let memberOptions = [];
    let priceGroups = [];
    let meUser = null;
    const noticeEl = document.getElementById("notice");
    function notify(m) { noticeEl.textContent = m; noticeEl.classList.add("show"); setTimeout(() => noticeEl.classList.remove("show"), 2200); }
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function fmtDate(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return y + "年" + +m + "月" + +dd + "日"; }
    function dateRange(g) { return fmtDate(g.start_date) + " ~ " + fmtDate(g.end_date); }
    function renderPriceGroups() {
      const box = document.getElementById("price-list");
      if (!priceGroups.length) { box.innerHTML = '<div class="price-empty">暂无价格分组</div>'; return; }
      box.innerHTML = priceGroups.map(g => {
        const nameCtrl = `<input id="pgt-name-${g.id}" value="${esc(g.name)}" aria-label="价格分组名称">`;
        return `<div class="group-line ${g.is_default ? "is-default" : ""}">
          <div class="price-group-name">${g.is_default ? '<span class="gdef">默认组</span><span class="p-meta">全局兜底</span>' : nameCtrl}${g.country_name ? `<span class="p-meta">${esc(g.country_name)}</span>` : ""}</div>
          <label>税率（%）<input id="pgt-tax-${g.id}" type="number" step="0.1" min="0" max="100" value="${g.tax_rate}"></label>
          <label>汇率（1 本币 = 元）<input id="pgt-rate-${g.id}" type="number" step="0.0001" min="0.0001" value="${g.exchange_rate_jpy_cny}"></label>
          <button class="p-btn" onclick="savePriceGroup(${g.id})">保存</button>
          ${g.is_default ? "" : (g.user_count > 0 ? '<span class="p-meta">有成员，先调整归属再删</span>' : `<button class="p-btn danger" onclick="removePriceGroup(${g.id})">删除</button>`)}
        </div>`;
      }).join("") || '<div class="empty">暂无分组</div>';
    }
    async function loadPriceGroups() { priceGroups = await api("/api/settings/price-groups"); renderPriceGroups(); loadCountries(); }
    let COUNTRIES = [];
    function countryName(code) {
      const c = (COUNTRIES || []).find(x => x.code === code);
      return c ? c.name : code;
    }
    async function loadCountries() {
      try { COUNTRIES = await api("/api/settings/countries"); } catch (_) { COUNTRIES = []; }
      const opts = (COUNTRIES || []).map(c =>
        `<option value="${c.code}" data-tip="${c.scrapers && c.scrapers.length ? "比价网站：" + c.scrapers.join(" / ") : "暂无比价网站"}">${c.name}（${c.symbol}${c.currency}）</option>`).join("");
      const sel = document.getElementById("pgn-country");
      if (sel) sel.innerHTML = '<option value="">选择国家</option>' + opts;
      const ag = document.getElementById("g-country");
      if (ag) ag.innerHTML = opts || '<option value="">未配置国家</option>';
    }
    function onPgCountry() {
      const code = document.getElementById("pgn-country").value;
      const c = (COUNTRIES || []).find(x => x.code === code);
      if (!c) return;
      document.getElementById("pgn-tax").value = c.tax_rate;
      document.getElementById("pgn-rate").value = c.exchange_rate_cny;
      const cur = document.getElementById("pgn-cur"); if (cur) cur.textContent = c.currency;
      const opt = document.getElementById("pgn-country").selectedOptions[0];
      notify("已继承「" + c.name + "」参数" + (opt && opt.dataset.tip ? " · " + opt.dataset.tip : ""));
    }
    async function addPriceGroup() {
      const name = document.getElementById("pgn-name").value.trim();
      const tax = parseFloat(document.getElementById("pgn-tax").value);
      const rate = parseFloat(document.getElementById("pgn-rate").value);
      const country = document.getElementById("pgn-country").value || null;
      if (!name) { notify("请填写分组名称"); return; }
      try { await api("/api/settings/price-groups", { method: "POST", body: { name, tax_rate: tax, exchange_rate_jpy_cny: rate, country } }); document.getElementById("pgn-name").value = ""; await loadPriceGroups(); notify("价格分组已添加"); }
      catch (err) { notify(err.message || "添加失败"); }
    }
    async function savePriceGroup(id) {
      const g = priceGroups.find(x => x.id === id); if (!g) return;
      const nameInput = document.getElementById("pgt-name-" + id);
      const body = { name: nameInput ? nameInput.value.trim() : g.name, tax_rate: parseFloat(document.getElementById("pgt-tax-" + id).value), exchange_rate_jpy_cny: parseFloat(document.getElementById("pgt-rate-" + id).value) };
      if (!body.name) { notify("分组名称不能为空"); return; }
      try { await api("/api/settings/price-groups/" + id, { method: "PUT", body }); await loadPriceGroups(); notify("价格分组已更新"); }
      catch (err) { notify(err.message || "保存失败"); }
    }
    async function removePriceGroup(id) {
      const g = priceGroups.find(x => x.id === id); if (!g || !confirm("删除价格分组「" + g.name + "」？")) return;
      try { await api("/api/settings/price-groups/" + id, { method: "DELETE" }); await loadPriceGroups(); notify("价格分组已删除"); }
      catch (err) { notify(err.message || "删除失败"); }
    }
    async function copyInvite(code, btn) {
      try { await navigator.clipboard.writeText(code); notify("邀请码 " + code + " 已复制"); }
      catch (_) { btn && btn.select && btn.select(); notify("请手动复制邀请码 " + code); }
    }
    // 复制「邀请链接」：通过该链接打开登录页会自动加入本组（登录/注册成功后入组）。
    function inviteLink(code) { return location.origin + "/login.html?invite=" + code; }
    async function copyInviteLink(code, btn) {
      const link = inviteLink(code);
      try { await navigator.clipboard.writeText(link); notify("邀请链接已复制，发同事点开即可自动入组"); }
      catch (_) { btn && btn.select && btn.select(); notify("请手动复制链接：" + link); }
    }

    function render() {
      const box = document.getElementById("groups");
      if (!COUNTRIES.length) loadCountries();
      document.getElementById("group-total").textContent = groups.length;
      const all = groups.reduce((s, g) => s + (g.total || 0), 0);
      const done = groups.reduce((s, g) => s + (g.purchased || 0), 0);
      document.getElementById("item-all").textContent = all;
      document.getElementById("item-done").textContent = done;
      document.getElementById("quota-tip").textContent = groups.length >= 3 ? "已达 3 个组上限：完成的组会保留名额，如需新建请删除无用组（删除仅限没有归组清单的组）。" : "还可创建 " + (3 - groups.length) + " 个组（累计上限 3，含已完成）。";
      if (!groups.length) { box.innerHTML = '<div class="empty">还没有出游采购组，先在上方创建一个吧</div>'; return; }
      box.innerHTML = groups.map(g => {
        const members = g.members || [];
        const items = g.items || [];
        return `<article class="group">
          <div class="group-head"><div>
            <div class="group-title">${esc(g.title)}</div>
            <div class="group-meta">${esc(dateRange(g))} · ${g.country ? countryName(g.country) + " · " : ""}共 ${g.total} 件 · 已采购 ${g.purchased} 件</div>
            ${g.status === "open" ? `<div class="invite-row"><div class="invite"><span>入组邀请码</span><code>${esc(g.invite_code)}</code><button class="copy" onclick="copyInvite('${esc(g.invite_code)}', this)">复制邀请码</button></div><div class="invite invite-link"><span>邀请链接</span><button class="copy" onclick="copyInviteLink('${esc(g.invite_code)}', this)" title="复制链接，同事点开登录/注册后自动入组">复制邀请链接</button></div></div>` : ""}
            ${members.length ? `<div class="member-chips">${members.map(m => g.status === "open"
              ? `<span class="mchip">${esc(m.full_name || m.email)}<button type="button" class="mchip-x" onclick="removeMember(${g.id}, ${m.id})" title="移除该成员">×</button></span>`
              : `<a class="mchip" href="member.html?group_id=${g.id}&member_id=${m.id}" title="查看 ${esc(m.full_name || m.email)} 在本组提交的清单">${esc(m.full_name || m.email)}</a>`).join("")}</div>` : ""}
          </div>
          <span class="badge ${g.status}">${g.status === "completed" ? "已完成" : "进行中"}</span></div>
          ${(g.batches || []).length ? renderBatches(g) : ""}
          ${g.status === "open" ? renderPullBar(g, members) : ""}
          <div class="items">${items.length ? renderGroupItems(items) : '<div class="empty">该组还没有成员提交的清单</div>'}</div>
          <div class="group-foot">
            <div class="g-actions">
              <button class="g-btn" onclick="exportGroupRecon(${g.id})">导出对账单</button>
              ${g.status === "open" ? `<button class="g-btn" onclick="completeGroup(${g.id})">标记完成（结束收单）</button>` : ""}
              <button class="g-btn danger" onclick="deleteGroup(${g.id})">删除组</button>
            </div>
          </div>
        </article>`;
      }).join("");
    }

    function renderPullBar(g, members) {
      const mine = new Set(members.map(m => m.id));
      const options = memberOptions.filter(u => !mine.has(u.id));
      return `<div class="pull-panel">
        <div class="pull-head">把需求人拉入当前组：</div>
        ${options.length ? `<div class="pull-opts">${options.map(u => `<label class="opt-chip"><input type="checkbox" data-uid="${u.id}">${esc(u.full_name || u.email)}</label>`).join("")}</div>
        <div class="pull-bar"><button class="g-btn primary" onclick="pullMembers(${g.id})">加入选中需求人</button><span style="color:var(--muted);font-size:11.5px">或把上方邀请码发给同事，让 TA 在「我的清单」页自助加入</span></div>` : '<div style="color:var(--muted);font-size:12px">没有可拉入的普通用户（全员都已在组内）</div>'}
      </div>`;
    }
    async function removeMember(gid, uid) {
      const g = groups.find(x => x.id === gid);
      const m = (g && g.members || []).find(x => x.id === uid);
      if (!g || !m) return;
      if (!confirm("把「" + (m.full_name || m.email) + "」移出该出游组？其已提交/锁定的清单仍保留，采购员继续处理。")) return;
      try {
        await api("/api/groups/" + gid + "/members/" + uid, { method: "DELETE" });
        await loadAll();
        notify("已移除该成员");
      } catch (err) { notify(err.message || "移除失败"); }
    }

    // 每人每批次的锁定/解锁入口：批次在组开始后按「提交一次锁定一次」递增。
    function renderBatches(g) {
      const canManage = g.status === "open";
      return `<div class="g-batches">${(g.batches || []).map(b => {
        const who = (b.requester && (b.requester.full_name || b.requester.email)) || "";
        let act = "";
        if (canManage && b.status === "submitted") act = `<button class="bbtn" onclick="setBatchStatus(${g.id}, ${b.cart_id}, 'locked')">锁定该批</button>`;
        else if (canManage && b.status === "locked") act = `<button class="bbtn unlock" onclick="setBatchStatus(${g.id}, ${b.cart_id}, 'draft')">解锁（可编辑）</button>`;
        return `<div class="g-batch">
          <span class="gb-who">${esc(who)}</span>
          <span class="gb-no">第 ${b.batch_no || 1} 批</span>
          <span class="gb-badge ${b.status}">${esc(STATUS_LABELS[b.status] || b.status)}</span>
          <span class="gb-meta">${b.count} 件</span>
          ${b.status === "locked" || b.status === "success" ? `<label class="gb-transfer"><span class="settlement-label">转账单号</span><input value="${esc(b.transfer_no || "")}" placeholder="填写单号" onchange="saveTransfer(${b.cart_id}, this.value)"></label>
          <label class="check receipt-check ${b.receipt_confirmed ? "on" : ""}"><input type="checkbox" ${b.receipt_confirmed ? "checked" : ""} onchange="toggleReceipt(${b.cart_id}, this.checked)">查收确认</label>` : ""}
          ${act ? `<span class="g-batch-actions">${act}</span>` : ""}
        </div>`;
      }).join("")}</div>`;
    }
    async function setBatchStatus(gid, cartId, status) {
      if (status === "draft" && !confirm("解锁后该批恢复为草稿，成员可修改数量/删除条目后重新提交；确定解锁？")) return;
      try {
        await api("/api/groups/" + gid + "/carts/" + cartId + "/status", { method: "PATCH", body: { status } });
        notify(status === "locked" ? "已锁定该批（出游开始后会自动为成员开立下一批草稿）" : "已解锁，该批恢复为可编辑草稿");
        await loadAll();
      } catch (err) { notify(err.message || "操作失败"); }
    }

    async function createGroup() {
      const title = document.getElementById("g-title").value.trim();
      const country = document.getElementById("g-country").value || null;
      const start = document.getElementById("g-start").value;
      const end = document.getElementById("g-end").value;
      if (!title) { notify("请填写组标题"); return; }
      if (!start || !end) { notify("请选择出游开始与结束日期"); return; }
      if (end < start) { notify("结束日期不能早于开始日期"); return; }
      try {
        const g = await api("/api/groups", { method: "POST", body: { title, start_date: start, end_date: end, country } });
        document.getElementById("g-title").value = "";
        document.getElementById("g-start").value = "";
        document.getElementById("g-end").value = "";
        await loadAll();
        const cname = (COUNTRIES || []).find(x => x.code === country);
        notify("出游组已创建，邀请码见组卡片；组内清单默认按" + (cname ? cname.name : "原价格组") + "折算");
      } catch (err) { notify(err.message || "创建失败"); }
    }
    async function completeGroup(id) {
      const g = groups.find(x => x.id === id);
      if (!g) return;
      if (!confirm("标记组「" + g.title + "」为完成？完成后该组停止收单，成员不能再提交清单给该组。")) return;
      try { await api("/api/groups/" + id, { method: "PATCH", body: { status: "completed" } }); await loadAll(); notify("组已标记完成"); }
      catch (err) { notify(err.message || "操作失败"); }
    }
    async function deleteGroup(id) {
      const g = groups.find(x => x.id === id);
      if (!g || !confirm("确定删除出游组「" + g.title + "」？组内无已提交清单时才可删除。")) return;
      try { await api("/api/groups/" + id, { method: "DELETE" }); await loadAll(); notify("组已删除"); }
      catch (err) { notify(err.message || "删除失败"); }
    }
    async function pullMembers(groupId) {
      const uids = [...document.querySelectorAll('.pull-panel .opt-chip input[data-uid]:checked')].map(i => parseInt(i.dataset.uid, 10));
      if (!uids.length) { notify("请先勾选要拉入的需求人"); return; }
      try { await api("/api/groups/" + groupId + "/members", { method: "POST", body: { user_ids: uids } }); await loadAll(); notify("已加入选中需求人"); }
      catch (err) { notify(err.message || "操作失败"); }
    }

    async function loadGroups() { groups = await api("/api/groups/me"); render(); }
    async function loadMemberOptions() { memberOptions = await api("/api/groups/member-options"); }
    async function loadAll() { try { await Promise.all([loadGroups(), loadMemberOptions(), loadPriceGroups()]); } catch (err) { document.getElementById("groups").innerHTML = '<div class="empty">' + esc(err.message) + "</div>"; } }

    const P_CHIP_COLORS = [["黑", "#2b2f2b"], ["白", "#e9e9e9"], ["红", "#a3463f"], ["蓝", "#336fa9"], ["绿", "#28725a"], ["黄", "#d9a441"], ["粉", "#d972a0"], ["紫", "#7a5aa8"], ["棕", "#8a6642"], ["灰", "#8b908c"], ["橙", "#d97441"], ["金", "#c9a227"], ["银", "#a9b0b4"], ["透明", "#cfe2ec"]];
    function pChipColor(color) { for (const [k, v] of P_CHIP_COLORS) { if (color.includes(k)) return v; } return "#5c6b63"; }
    function pChecks(item) {
      return `<span class="check-col">
        <label class="check ${item.purchase_confirmed ? 'c-conf on' : 'c-conf'}"><input type="checkbox" ${item.purchase_confirmed ? 'checked' : ''} onchange="toggleConfirmed(${item.id}, this.checked)" title="确认采购">采购确认</label>
        <label class="check ${item.purchased ? 'on' : ''}"><input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="togglePurchased(${item.id}, this.checked)" title="标记是否已采购">已采购</label>
      </span>`;
    }
    function pRemark(item) {
      const val = (item.procurement_remark || "").replace(/"/g, "&quot;");
      return `<div class="p-remark"><textarea rows="1" placeholder="采购侧备注（仅采购/管理员可编辑，需求人只读）" onchange="saveRemark(${item.id}, this.value)">${esc(item.procurement_remark || "")}</textarea></div>`;
    }
    function pPriceBoxes(item) {
      const p = item.product;
      return `<span class="price-boxes" aria-label="只读价格"><span class="price-box original">税前单价 ${money(item.pretax_price_cents ?? item.unit_price_cents, p.currency)}</span><span class="price-box taxed">含税价 ${money(item.taxed_price_cents ?? p.taxed_price_cents, p.currency)}</span><span class="price-box cny">人民币 ${money(item.price_cny_cents ?? p.price_cny_cents, "CNY")}</span></span>`;
    }
    function pSubRow(item, nested) {
      const color = (item.color || "").trim();
      const colorTxt = color || "默认";
      const who = esc((item.requester || {}).full_name || (item.requester || {}).email || "");
      const nameHtml = nested
        ? `<span class="color-chip">${esc(colorTxt)}</span>`
        : (esc(item.product.name) + (color ? ` <span class="color-chip">${esc(color)}</span>` : ""));
      const metaBits = nested
        ? [`× ${item.quantity}`, who].filter(Boolean)
        : [color ? esc(colorTxt) : "", `× ${item.quantity}`, who].filter(Boolean);
      return `<div class="item${nested ? " sub" : ""} ${item.purchased ? "done" : ""}">
        ${pChecks(item)}
        ${nested ? "" : itemThumb(item, "b-thumb")}
        <div class="info"><div class="name">${nameHtml}</div><div class="meta">${metaBits.join(" · ")}</div>${pPriceBoxes(item)}${pRemark(item)}</div>
      </div>`;
    }
    function pGroupHead(group) {
      const first = group.rows[0];
      const p = first.product;
      const note = (p.remark || "").trim();
      const typeBit = (p.category || "").trim();
      const requester = first.requester || {};
      const tq = group.rows.reduce((s, i) => s + i.quantity, 0);
      const sumNative = group.rows.reduce((s, i) => s + (i.taxed_price_cents || 0) * i.quantity, 0);
      const sumCny = group.rows.reduce((s, i) => s + (i.price_cny_cents || 0) * i.quantity, 0);
      const headMeta = [typeBit ? `类型：${typeBit}` : "", `需求人 ${esc(requester.full_name || requester.email)}`, `共 ${tq} 件`, `税前单价 ${money(first.pretax_price_cents ?? first.unit_price_cents, p.currency)} · 含税价 ${money(first.taxed_price_cents ?? p.taxed_price_cents, p.currency)}/件`].filter(Boolean).join(" · ");
      return `<div class="pg-head">${itemThumb(first, "b-thumb")}
        <div style="min-width:0"><div class="pg-name">${esc(p.name)}</div><div class="pg-sub">${esc(headMeta)}</div>${note ? `<div class="pg-note">备注：${esc(note)}</div>` : ""}</div>
        <div class="pg-total">${money(sumNative, p.currency)}${sumCny ? `<div class="cny">≈ ${money(sumCny, "CNY")}</div>` : ""}</div>
      </div>`;
    }
    function renderGroupItems(items) {
      // 手工商品多颜色（同组、同需求人、同 product）→ 分组卡；其余普通行。
      const out = [];
      let cur = null;
      for (const it of items || []) {
        const manual = it.product && it.product.source_name === "手工添加";
        const rid = it.requester ? it.requester.id : null;
        if (manual) {
          if (cur && cur.key === it.product.id + "|" + rid) { cur.rows.push(it); continue; }
          if (cur) out.push(cur);
          cur = { key: it.product.id + "|" + rid, rows: [it] };
        } else {
          if (cur) { out.push(cur); cur = null; }
          out.push({ plain: it });
        }
      }
      if (cur) out.push(cur);
      return out.map(s => {
        if (s.plain) return pSubRow(s.plain);
        if (s.rows.length === 1) return pSubRow(s.rows[0]);
        return `<div class="pgroup">${pGroupHead(s)}${s.rows.map(it => pSubRow(it, true)).join("")}</div>`;
      }).join("");
    }
    async function saveTransfer(cartId, transferNo) {
      try { await api("/api/admin/carts/" + cartId + "/transfer", { method: "PATCH", body: { transfer_no: transferNo } }); notify("转账单号已保存"); }
      catch (err) { notify(err.message || "保存失败"); }
    }
    async function toggleReceipt(cartId, confirmed) {
      try { await api("/api/admin/carts/" + cartId + "/receipt-confirmed", { method: "PATCH", body: { confirmed } }); await loadAll(); notify(confirmed ? "已确认查收" : "已取消查收确认"); }
      catch (err) { notify(err.message || "保存失败"); }
    }
    async function toggleConfirmed(itemId, confirmed) {
      await api("/api/admin/cart-items/" + itemId + "/confirmed", { method: "PATCH", body: { confirmed } });
      await loadAll(); notify(confirmed ? "已确认采购" : "已取消确认采购");
    }
    async function togglePurchased(itemId, purchased) {
      await api("/api/admin/cart-items/" + itemId + "/purchased", { method: "PATCH", body: { purchased } });
      await loadAll(); notify(purchased ? "已标记为已采购" : "已取消采购标记");
    }
    async function saveRemark(itemId, remark) {
      try { await api("/api/admin/cart-items/" + itemId + "/remark", { method: "PATCH", body: { remark } }); notify("采购备注已保存"); }
      catch (err) { notify(err.message || "保存失败"); }
    }

    function exportGroupRecon(gid) {
      if (!window.ExportRecon) { notify("导出模块未加载"); return; }
      const g = groups.find(x => x.id === gid);
      if (!g) { notify("未找到该组"); return; }
      const who = (meUser && (meUser.full_name || meUser.email)) || "";
      ExportRecon.open({
        title: (g.title || "出游组") + " · 分人对账单",
        group: g,
        exporter: who,
        items: g.items || [],
        batches: g.batches || [],
      });
    }
    (async function init() {
      const me = await requireRole("purchaser");
      if (!me) return;
      meUser = me;
      document.getElementById("who").textContent = me.full_name || me.email;
      document.getElementById("avatar").textContent = initials(me.full_name || me.email);
      await loadAll();
    })().catch(err => { document.getElementById("groups").innerHTML = '<div class="empty">' + esc(err.message) + "</div>"; });
  </script>
</body>
</html>

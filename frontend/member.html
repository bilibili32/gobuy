  <style>
    :root { --bg:#f6f2e9; --surface:#fffdfa; --ink:#25312d; --muted:#7b847f; --line:#e6dfd3; --line-soft:#f0ece5; --green:#28725a; --green-dark:#1e5e49; --green-bg:#e5f0e9; --amber:#966209; --amber-bg:#fff0d5; --blue:#336fa9; --blue-bg:#e8f0f8; --red:#a3463f; --red-bg:#f8e7e4; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:var(--bg); color:var(--ink); font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; } a { color:var(--green); }
    .page { max-width:900px; margin:auto; padding:30px 26px 44px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:24px; } .brand { font-size:18px; font-weight:800; } .brand span { color:var(--green); } .account { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:13px; } .avatar { width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:#dfeae2; color:var(--green); font-size:11px; font-weight:800; } .logout { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:4px; padding:6px 12px; font-weight:700; cursor:pointer; } .logout:hover { color:#a3463f; border-color:#a3463f; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; } .back { color:var(--muted); text-decoration:none; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:5px; } .back:hover { color:var(--green); }
    h1 { margin:0; font-size:24px; }
    .mcard { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; flex-wrap:wrap; }
    .big-avatar { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:#dcebe1; color:var(--green-dark); font-size:18px; font-weight:800; flex:none; }
    .m-name { font-size:17px; font-weight:800; } .m-mail { color:var(--muted); font-size:12.5px; margin-top:2px; } .m-extra { margin-left:auto; text-align:right; color:var(--muted); font-size:12px; line-height:1.8; }
    .badge { border-radius:999px; padding:3px 9px; font-size:11px; font-weight:750; white-space:nowrap; } .badge.open { color:var(--amber); background:var(--amber-bg); } .badge.completed { color:var(--green); background:var(--green-bg); }
    .stats { display:flex; gap:8px; flex-wrap:wrap; margin:13px 0 16px; } .stat { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font-size:12px; color:var(--muted); } .stat b { color:var(--ink); font-size:14px; } .stat .cny { display:inline; color:var(--muted); font-size:11px; font-weight:500; margin-left:5px; }
    .items { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }

    .b-thumb { width:52px; height:52px; display:grid; place-items:center; border-radius:6px; background:#eef1ec; color:#496258; font-size:10px; font-weight:800; overflow:hidden; } .b-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .check-col { display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
    .check { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; cursor:pointer; user-select:none; white-space:nowrap; } .check input { appearance:none; width:17px; height:17px; margin:0; border:1.5px solid #c9d2cc; border-radius:4px; background:#fff; position:relative; cursor:pointer; transition:.15s; flex:none; } .check input:hover { border-color:var(--green); } .check input:checked { background:var(--green); border-color:var(--green); } .check input:checked::after { content:"✓"; position:absolute; left:3.5px; top:-1px; color:#fff; font-size:11px; font-weight:800; } .check.on { color:var(--green); font-weight:700; }
    .check.c-conf input:checked { background:var(--amber); border-color:var(--amber); } .check.c-conf.on { color:var(--amber); font-weight:700; }
    .info { min-width:0; } .pname { font-weight:750; font-size:13.5px; } .pmeta { color:var(--muted); font-size:11px; margin-top:3px; line-height:1.7; word-break:break-all; } .pnote { margin-top:4px; font-size:11px; color:#7d6a3c; background:var(--amber-bg); border-radius:4px; padding:3px 7px; line-height:1.5; word-break:break-all; } .p-remark { margin-top:6px; } .p-remark textarea { width:100%; max-width:480px; min-height:30px; padding:5px 8px; border:1px dashed var(--line); border-radius:5px; background:#fffdfa; color:var(--ink); font-size:12px; line-height:1.4; resize:vertical; outline:none; } .p-remark textarea:focus { border-style:solid; border-color:var(--green); box-shadow:0 0 0 3px rgba(40,114,90,.08); }
    .color-chip { display:inline-block; padding:1px 7px; border-radius:999px; background:#eef1ec; color:#496258; font-size:10.5px; font-weight:700; white-space:nowrap; }
    .cst { display:inline-block; border-radius:999px; padding:1px 7px; font-size:10px; font-weight:700; } .cst.submitted { color:var(--amber); background:var(--amber-bg); } .cst.locked { color:var(--blue); background:var(--blue-bg); } .cst.success { color:var(--green); background:var(--green-bg); } .cst.failed { color:var(--red); background:var(--red-bg); }
    .price-boxes { display:inline-flex; flex-wrap:wrap; gap:4px; vertical-align:middle; }
    .price-box { display:inline-flex; align-items:center; min-height:22px; padding:2px 7px; border:1px solid #e6dfd3; border-radius:4px; background:#fffdfa; color:#7b847f; font-size:11px; white-space:nowrap; }
    .price-box.original { color:var(--ink); }
    .price-box.taxed { color:var(--green-dark); background:var(--green-bg); border-color:#c8ded1; }
    .price-box.cny { color:#7d5a16; background:var(--amber-bg); border-color:#f0dcae; }
    .pgroup { border-top:1px solid var(--line-soft); } .pg-head { display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 18px; background:#fbf8f0; border-bottom:1px solid var(--line); } .pg-name { font-weight:800; font-size:13.5px; line-height:1.35; } .pg-sub { color:var(--muted); font-size:11px; margin-top:2px; } .pg-total { text-align:right; white-space:nowrap; font-size:13px; font-weight:800; } .pg-total .cny { font-size:10.5px; color:var(--muted); font-weight:500; }
    .empty { padding:44px 16px; text-align:center; color:var(--muted); font-size:13px; } .loading { padding:44px 16px; text-align:center; color:var(--muted); font-size:13px; } .err { padding:30px 16px; text-align:center; color:var(--red); font-size:13.5px; }
    .notice { position:fixed; right:22px; bottom:22px; padding:11px 14px; border-radius:5px; background:#28463a; color:#fff; opacity:0; pointer-events:none; transform:translateY(7px); transition:opacity .2s ease, transform .2s ease; z-index:10; } .notice.show { opacity:1; transform:translateY(0); }
    @media(max-width:600px) { .page { padding:20px 14px 34px; } .item { grid-template-columns:auto 44px 1fr; gap:8px; } .b-thumb { width:44px; height:44px; } .m-extra { margin-left:0; text-align:left; width:100%; } }
  </style>

  <script src="auth.js"></script>
  <script>
    const esc = escHtml;
    const Q = new URLSearchParams(location.search);
    const gid = parseInt(Q.get("group_id") || "", 10);
    const mid = parseInt(Q.get("member_id") || "", 10);
    const noticeEl = document.getElementById("notice");
    function notify(m) { noticeEl.textContent = m; noticeEl.classList.add("show"); setTimeout(() => noticeEl.classList.remove("show"), 2200); }

    const P_CHIP_COLORS = [["黑", "#2b2f2b"], ["白", "#e9e9e9"], ["红", "#a3463f"], ["蓝", "#336fa9"], ["绿", "#28725a"], ["黄", "#d9a441"], ["粉", "#d972a0"], ["紫", "#7a5aa8"], ["棕", "#8a6642"], ["灰", "#8b908c"], ["橙", "#d97441"], ["金", "#c9a227"], ["银", "#a9b0b4"], ["透明", "#cfe2ec"]];
    function pChipColor(color) { for (const [k, v] of P_CHIP_COLORS) { if (color.includes(k)) return v; } return "#5c6b63"; }
    function fmtDate(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return y + "年" + +m + "月" + +dd + "日"; }
    function range(g) { return fmtDate(g.start_date) + " ~ " + fmtDate(g.end_date); }
    function nativeSum(items) {
      const g = {};
      for (const it of items) { const c = (it.product && it.product.currency) || "CNY"; g[c] = (g[c] || 0) + (it.taxed_price_cents || it.unit_price_cents || 0) * (it.quantity || 0); }
      return Object.entries(g).map(([c, v]) => money(v, c)).join(" + ") || money(0, "CNY");
    }
    function cnyEq(items) { return items.reduce((s, i) => s + (i.price_cny_cents || 0) * (i.quantity || 0), 0); }

    function stBadge(st) { return st ? `<span class="cst ${esc(st)}">${esc((STATUS_LABELS[st] || st))}</span>` : ""; }
    function checks(it) {
      return `<span class="check-col">
        <label class="check ${it.purchased ? 'on' : ''}" title="标记是否已采购"><input type="checkbox" ${it.purchased ? 'checked' : ''} onchange="togglePurchased(${it.id}, this.checked)">已采购</label>
      </span>`;
    }
    function remarkBox(it) {
      return `<div class="p-remark"><textarea rows="1" placeholder="采购侧备注（仅采购/管理员可编辑，需求人只读）" onchange="saveRemark(${it.id}, this.value)">${esc(it.procurement_remark || "")}</textarea></div>`;
    }
    function rowHtml(it) {
      const p = it.product || {};
      const color = (it.color || "").trim();
      const nameHtml = esc(p.name) + (color ? ` <span class="color-chip">${esc(color)}</span>` : "");
      const typeBit = (p.category || "").trim();
      const priceBoxes = `<span class="price-boxes" aria-label="只读价格"><span class="price-box original">税前单价 ${money(it.pretax_price_cents ?? it.unit_price_cents, p.currency)}</span><span class="price-box taxed">含税价 ${money(it.taxed_price_cents ?? p.taxed_price_cents, p.currency)}</span><span class="price-box cny">人民币 ${money(it.price_cny_cents ?? p.price_cny_cents, "CNY")}</span></span>`;
      const meta = [typeBit ? "类型：" + typeBit : "", "× " + it.quantity, priceBoxes, stBadge(it.cart_status)].filter(Boolean).join(" · ");
      const note = (p.remark || "").trim();
      return `<div class="item ${it.purchased ? 'done' : ''}">
        ${checks(it)}
        ${itemThumb(it, "b-thumb")}
        <div class="info"><div class="pname">${nameHtml}</div><div class="pmeta">${meta}</div>${note ? `<div class="pnote">备注：${esc(note)}</div>` : ""}${remarkBox(it)}</div>
      </div>`;
    }
    function pgHead(rows) {
      const first = rows[0], p = first.product || {}, cur = p.currency;
      const typeBit = (p.category || "").trim();
      const tq = rows.reduce((s, i) => s + i.quantity, 0);
      const sum = rows.reduce((s, i) => s + (i.taxed_price_cents || 0) * i.quantity, 0);
      const sumCny = rows.reduce((s, i) => s + (i.price_cny_cents || 0) * i.quantity, 0);
      const sts = [...new Set(rows.map(i => i.cart_status))].map(stBadge).join("");
      const headMeta = [typeBit ? `类型：${typeBit}` : "", `共 ${tq} 件`, sts].filter(Boolean).join(" · ");
      return `<div class="pg-head">${itemThumb(first, "b-thumb")}
        <div style="min-width:0"><div class="pg-name">${esc(p.name)}</div><div class="pg-sub">${esc(headMeta)}</div></div>
        <div class="pg-total">${money(sum, cur)}${sumCny ? `<div class="cny">≈ ${money(sumCny, "CNY")}</div>` : ""}</div>
      </div>`;
    }
    function subRowHtml(it) {
      const color = (it.color || "").trim() || "默认";
      const dotStyle = it.color ? `background:${pChipColor(it.color)}` : "";
      return `<div class="item ${it.purchased ? 'done' : ''}">
        ${checks(it)}
        <div class="b-thumb" style="background:transparent"></div>
        <div class="info"><div class="pname"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;${dotStyle};margin-right:6px;vertical-align:1px"></span>${esc(color)}<span style="color:var(--muted);font-weight:600"> × ${it.quantity} · </span><span class="price-boxes" aria-label="只读价格"><span class="price-box original">税前单价 ${money(it.pretax_price_cents ?? it.unit_price_cents, it.product.currency)}</span><span class="price-box taxed">含税价 ${money(it.taxed_price_cents ?? it.product.taxed_price_cents, it.product.currency)}</span><span class="price-box cny">人民币 ${money(it.price_cny_cents ?? it.product.price_cny_cents, "CNY")}</span></span></div>${remarkBox(it)}</div>
      </div>`;
    }
    function renderItems(items) {
      // 手工商品（同商品多颜色/多清单）→ 合并为分组卡；链接商品单行展示。
      const out = []; let cur = null;
      for (const it of items || []) {
        const manual = it.product && it.product.source_name === "手工添加";
        if (manual) {
          if (cur && cur.key === it.product.id) { cur.rows.push(it); continue; }
          if (cur) out.push(cur);
          cur = { key: it.product.id, rows: [it] };
        } else {
          if (cur) { out.push(cur); cur = null; }
          out.push({ plain: it });
        }
      }
      if (cur) out.push(cur);
      return out.map(s => {
        if (s.plain) return rowHtml(s.plain);
        if (s.rows.length === 1) return rowHtml(s.rows[0]);
        return `<div class="pgroup">${pgHead(s)}${s.rows.map(subRowHtml).join("")}</div>`;
      }).join("");
    }

    function render(group, member, items) {
      const gName = (member && (member.full_name || member.email)) || "成员";
      const isAdmin = currentRole() === "admin";
      document.getElementById("back-link").href = isAdmin ? "admin.html" : "purchaser.html";
      document.getElementById("back-link").textContent = isAdmin ? "← 返回管理台" : "← 返回采购工作台";
      document.getElementById("mcard").innerHTML = `<div class="mcard">
        <span class="big-avatar">${esc(initials(gName))}</span>
        <div><div class="m-name">${esc(gName)}</div><div class="m-mail">${member && member.email ? esc(member.email) : ""}</div></div>
        <div class="m-extra">出游采购组：<b>${esc(group.title)}</b><br>${esc(range(group))} · <span class="badge ${group.status === "open" ? "open" : "completed"}">${group.status === "open" ? "进行中" : "已完成"}</span></div>
      </div>`;
      const done = items.filter(i => i.purchased).length;
      const conf = items.filter(i => i.purchase_confirmed).length;
      const cny = cnyEq(items);
      document.getElementById("stats").innerHTML = `
        <span class="stat">条目 <b>${items.length}</b> 件</span>
        <span class="stat">未采购 <b>${items.length - done}</b> 件</span>
        <span class="stat">已确认采购 <b>${conf}</b> 件</span>
        <span class="stat">金额合计 <b>${nativeSum(items)}</b>${cny ? `<div class="cny">≈ ${money(cny, "CNY")}</div>` : ""}</span>`;
      const box = document.getElementById("list");
      box.innerHTML = items.length
        ? `<div class="sec-t">TA 在本组提交的清单条目（点击成员名进入即聚焦此人）</div>` + renderItems(items)
        : '<div class="empty">该成员还没有向此出游采购组提交清单 —— 可把邀请码发给 TA 自助加入后提交</div>';
    }
    async function load() {
      const box = document.getElementById("list");
      box.innerHTML = '<div class="loading">加载中…</div>';
      if (!gid || !mid) { box.innerHTML = '<div class="err">链接缺少 group_id / member_id 参数</div>'; return; }
      try {
        const groups = await api(currentRole() === "admin" ? "/api/groups" : "/api/groups/me");
        const group = groups.find(g => g.id === gid);
        if (!group) { box.innerHTML = '<div class="err">未找到该出游采购组，或你无权查看</div>'; return; }
        const items = (group.items || []).filter(it => it.requester && it.requester.id === mid);
        const member = (group.members || []).find(m => m.id === mid) || (items[0] && items[0].requester);
        if (!member) { box.innerHTML = '<div class="err">该用户不是本组成员，没有可查看的清单</div>'; return; }
        render(group, member, items);
      } catch (err) {
        box.innerHTML = '<div class="err">' + esc(err.message || "加载失败") + "</div>";
      }
    }
    async function toggleConfirmed(itemId, confirmed) {
      try { await api("/api/admin/cart-items/" + itemId + "/confirmed", { method: "PATCH", body: { confirmed } }); notify(confirmed ? "已确认采购" : "已取消确认采购"); await load(); }
      catch (err) { notify(err.message || "操作失败"); }
    }
    async function togglePurchased(itemId, purchased) {
      try { await api("/api/admin/cart-items/" + itemId + "/purchased", { method: "PATCH", body: { purchased } }); notify(purchased ? "已标记为已采购" : "已取消采购标记"); await load(); }
      catch (err) { notify(err.message || "操作失败"); }
    }
    async function saveRemark(itemId, remark) {
      try { await api("/api/admin/cart-items/" + itemId + "/remark", { method: "PATCH", body: { remark } }); notify("采购侧备注已保存"); }
      catch (err) { notify(err.message || "保存失败"); }
    }

    (async function init() {
      const me = await requireAuth();
      if (!me) return;
      if (me.role !== "admin" && me.role !== "purchaser") {
        alert("成员清单仅供采购员与管理员查看");
        location.href = "index.html";
        return;
      }
      document.getElementById("who").textContent = me.full_name || me.email;
      document.getElementById("avatar").textContent = initials(me.full_name || me.email);
      await load();
    })().catch(err => { document.getElementById("list").innerHTML = '<div class="err">' + esc(err.message) + "</div>"; });
  </script>

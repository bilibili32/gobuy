# 生产部署：独立完整版 Compose。
# 只对外暴露 80/443（Caddy 做 HTTPS 终结），api/frontend/postgres/redis 均不映射宿主端口。
# 与基础 docker-compose.yml 相互独立，部署时只使用本文件。
#
# 一键部署：bash deploy/deploy.sh
# 手动部署：
#   cd deploy
#   cp .env.production.example .env.production   # 填好必填项
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procurement}
      POSTGRES_USER: ${POSTGRES_USER:-procurement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请填写 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?请填写 DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?请填写 JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?请填写 DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KAKAKU_KEYWORDS: ${KAKAKU_KEYWORDS:-}
      KAKAKU_INTERVAL: ${KAKAKU_INTERVAL:-10}
      KAKAKU_ROUND_INTERVAL: ${KAKAKU_ROUND_INTERVAL:-3600}
      KAKAKU_MAX_ITEMS: ${KAKAKU_MAX_ITEMS:-20}
      CRAWL_OUTPUT_DIR: ${CRAWL_OUTPUT_DIR:-/data/crawl}
    volumes:
      - crawl_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?请填写 DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
  crawl_data:
  caddy_data:
  caddy_config:
